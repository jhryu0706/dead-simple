<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dead.simple.apps — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; overflow: hidden; }
    body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script src="portfolio-data.js"></script>

  <script type="text/babel">
    function App() {
      const accent = "#ff3b1d";

      const t = {
        ink: "#0a0a0a",
        paper: "#ffffff",
        rule: "rgba(10,10,10,0.92)",
        ruleSoft: "rgba(10,10,10,0.18)",
        muted: "rgba(10,10,10,0.5)",
        accent,
        displayFont: '"Inter", "Helvetica Neue", Helvetica, Arial, sans-serif',
        bodyFont: '"Inter", "Helvetica Neue", Helvetica, Arial, sans-serif',
      };

      const D = window.PORTFOLIO_DATA;

      return (
        <div style={{
          fontFamily: t.bodyFont,
          color: t.ink,
          background: t.paper,
          height: "100vh",
          width: "100%",
          padding: "72px 96px",
          boxSizing: "border-box",
          display: "flex",
          flexDirection: "column",
          justifyContent: "flex-start",
          gap: 48,
          maxWidth: 1440,
          margin: "0 auto",
        }}>
          {/* TOP RULE + HEADER ROW */}
          <div>
            <div style={{ borderTop: `2px solid ${t.rule}`, marginBottom: 24 }} />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 24 }}>
            <Cell label="Studio" value="dead.simple.apps" t={t} />
            <Cell label="Practice" value="Independent" t={t} />
            <Cell label="Since" value="2024" t={t} />
            <Cell label="Enquiries" value={D.email} link={`mailto:${D.email}`} t={t} />
            </div>
          </div>

          {/* MASSIVE WORDMARK */}
          <div style={{ position: "relative" }}>
            <div style={{
              fontFamily: t.bodyFont,
              fontSize: 11,
              letterSpacing: "0.22em",
              textTransform: "uppercase",
              color: t.muted,
              marginBottom: 24,
            }}>
              <span style={{ color: t.accent }}>&#9679;</span> Software studio
            </div>
            <div style={{
              fontFamily: t.displayFont,
              fontWeight: 600,
              fontSize: "clamp(100px, 18vw, 260px)",
              lineHeight: 0.85,
              letterSpacing: "-0.06em",
              color: t.ink,
              textTransform: "lowercase",
            }}>
              dead<br/>simple<span style={{ color: t.accent }}>.</span>
            </div>
          </div>

          {/* FOOTER */}
          <div style={{ marginTop: "auto", display: "flex", justifyContent: "space-between", alignItems: "baseline", borderTop: `2px solid ${t.rule}`, paddingTop: 20, fontFamily: t.bodyFont, fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", color: t.muted }}>
            <div>dead.simple.apps</div>
            <div style={{ color: t.accent }}>&#9679; Open to commissions</div>
          </div>
        </div>
      );
    }

    function Cell({ label, value, link, t }) {
      const Tag = link ? "a" : "div";
      return (
        <div style={{ borderTop: `1px solid ${t.ruleSoft}`, paddingTop: 12 }}>
          <div style={{ fontFamily: t.bodyFont, fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: t.muted, marginBottom: 8 }}>
            {label}
          </div>
          <Tag href={link} style={{ fontFamily: t.bodyFont, fontSize: 14, color: t.ink, textDecoration: "none", display: "block" }}>
            {value}
          </Tag>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
